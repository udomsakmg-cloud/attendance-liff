<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px 15px; }
    button {
      width: 100%; padding: 16px; margin: 8px 0; font-size: 17px;
      border: none; border-radius: 10px; color: white; cursor: pointer;
    }
    #checkin { background: #06C755; }
    #checkout { background: #FF5555; }
    #captureBtn { background: #00B900; display: none; font-weight: bold; margin-top: 10px; }
    #openExternal { background: #888; font-size: 14px; padding: 12px; }
    
    #cameraContainer {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      display: none;
    }
    #video {
      width: 100%;
      max-height: 60vh;
      border-radius: 10px;
      background: #000;
      transform: scaleX(-1); /* กลับด้านกระจกสำหรับกล้องหน้า */
      object-fit: cover;
    }
    #canvas { display: none; }
    #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
    #status { margin-top: 15px; font-size: 14px; white-space: pre-line; }
  </style>
</head>
<body>
  <h2>📍 ลงเวลางาน</h2>

  <!-- ส่วนแสดงกล้องสด (บังคับเปิดผ่านโค้ด ไม่มีป๊อปอัปให้เลือกไฟล์) -->
  <div id="cameraContainer">
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">📸 กดถ่ายรูปยืนยัน</button>
  </div>
  
  <canvas id="canvas"></canvas>
  <img id="preview" alt="รูปตัวอย่าง">

  <button id="checkin">✅ เข้างาน</button>
  <button id="checkout">🔴 เลิกงาน</button>
  <button id="openExternal">🌐 เปิดด้วยเบราว์เซอร์ภายนอก (ถ้า GPS ไม่ทำงาน)</button>
  <div id="status">กำลังเตรียมระบบ...</div>

  <script>
    const LIFF_ID = '2010782987-4mjGpChs';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZp93MR15Yc-haCY1BBVOmAW3KyYlN3mZq7_Bhu7qfiJtENrgJWF7dX9HUKyYOubSmGA/exec';
    
    let pendingType = null;
    let liffReady = false;
    let mediaStream = null;

    document.getElementById('status').innerText = '0.5) กำลังโหลด LIFF SDK...';

    if (typeof liff === 'undefined') {
      document.getElementById('status').innerText = '❌ โหลด LIFF SDK ไม่สำเร็จ กรุณาเช็คอินเทอร์เน็ต';
    } else {
      liff.init({ liffId: LIFF_ID }).then(() => {
        liffReady = true;
        document.getElementById('status').innerText = '✅ พร้อมใช้งาน กดปุ่มเพื่อลงเวลา';
      }).catch(err => {
        document.getElementById('status').innerText = '❌ liff.init error: ' + JSON.stringify(err);
      });
    }

    document.getElementById('checkin').onclick = () => startCamera('เข้างาน');
    document.getElementById('checkout').onclick = () => startCamera('เลิกงาน');

    document.getElementById('openExternal').onclick = () => {
      if (liffReady && liff.isInClient()) {
        liff.openWindow({ url: window.location.href, external: true });
      } else {
        document.getElementById('status').innerText = 'หน้านี้เปิดอยู่นอก LINE แล้ว หรือยังไม่พร้อม';
      }
    };

    // --- เปิดกล้องหน้าตรงๆ แบบไม่ผ่านแท็กไฟล์ ---
    async function startCamera(type) {
      pendingType = type;
      document.getElementById('preview').style.display = 'none';
      document.getElementById('status').innerText = 'กำลังเปิดกล้องหน้า...';

      try {
        // ขอสิทธิ์และเปิดกล้องหน้าโดยตรง (facingMode: user)
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 } },
          audio: false
        });

        const videoElement = document.getElementById('video');
        videoElement.srcObject = mediaStream;
        
        // สลับหน้าจอซ่อนปุ่มหลัก แสดงจอกล้องแทน
        document.getElementById('cameraContainer').style.display = 'block';
        document.getElementById('captureBtn').style.display = 'block';
        document.getElementById('checkin').style.display = 'none';
        document.getElementById('checkout').style.display = 'none';
        document.getElementById('openExternal').style.display = 'none';
        document.getElementById('status').innerText = 'จัดท่าทางให้เรียบร้อย แล้วกดปุ่มถ่ายรูป';

      } catch (err) {
        document.getElementById('status').innerText = '❌ ไม่สามารถเปิดกล้องได้: ' + err.message + '\n(กรุณาตรวจสอบการอนุญาตสิทธิ์กล้องในมือถือ)';
      }
    }

    // --- กดถ่ายภาพจากหน้าจอสตรีม ---
    document.getElementById('captureBtn').onclick = function() {
      const videoElement = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      
      const imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

      // ปิดกล้องหลังถ่ายเสร็จ
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      // ซ่อนจอกล้อง แสดงรูปพรีวิว
      document.getElementById('cameraContainer').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'none';
      
      const preview = document.getElementById('preview');
      preview.src = imageBase64;
      preview.style.display = 'block';

      // ไปขั้นตอนดึงพิกัด GPS และส่งข้อมูล
      getLocationAndSubmit(imageBase64);
    };

    // --- ดึง GPS ---
    function getLocationAndSubmit(imageBase64) {
      document.getElementById('status').innerText = '1) กำลังค้นหาตำแหน่ง GPS...';

      if (!navigator.geolocation) {
        resetUI();
        document.getElementById('status').innerText = '❌ เบราว์เซอร์นี้ไม่รองรับ GPS';
        return;
      }

      let gpsFinished = false;
      const gpsTimeout = setTimeout(() => {
        if (!gpsFinished) {
          gpsFinished = true;
          resetUI();
          document.getElementById('status').innerText = '❌ ไม่สามารถดึงตำแหน่ง GPS ทันเวลา';
        }
      }, 10000);

      navigator.geolocation.getCurrentPosition(async (pos) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        
        await submitData(pos.coords.latitude, pos.coords.longitude, imageBase64);
      }, (err) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        resetUI();
        document.getElementById('status').innerText = `❌ GPS error: ${err.message}`;
      }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
    }

    // --- ส่งข้อมูล ---
    async function submitData(lat, lng, imageBase64) {
      document.getElementById('status').innerText = '2) กำลังดึงข้อมูลโปรไฟล์ LINE...';

      let name = null;
      try {
        if (liffReady && liff.isLoggedIn && liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          name = profile.displayName;
        }
      } catch (err) {
        name = null;
      }

      if (!name) {
        name = prompt('กรุณาพิมพ์ชื่อ-นามสกุลของคุณ:');
        if (!name || name.trim() === "") {
          resetUI();
          document.getElementById('status').innerText = '❌ ยกเลิก: ไม่ได้กรอกชื่อ';
          return;
        }
      }

      document.getElementById('status').innerText = '3) กำลังส่งข้อมูลไปยังระบบ...';

      try {
        const payload = {
          name: name,
          type: pendingType,
          lat: lat,
          lng: lng,
          image: imageBase64
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        resetUI();
        if (result.success) {
          document.getElementById('status').innerText = '✅ ' + result.message + ' (' + name + ')';
        } else {
          document.getElementById('status').innerText = '❌ เกิดข้อผิดพลาด: ' + result.message;
        }

      } catch (err) {
        resetUI();
        document.getElementById('status').innerText = '❌ ส่งข้อมูลไม่สำเร็จ: ' + err.message;
      }
    }

    function resetUI() {
      document.getElementById('checkin').style.display = 'block';
      document.getElementById('checkout').style.display = 'block';
      document.getElementById('openExternal').style.display = 'block';
    }
  </script>
</body>
</html>
