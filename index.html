<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลางานและจัดการ OT</title>
  <!-- Bootstrap 5 CSS สำหรับความสวยงาม -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-dark text-light"> <!-- ปรับเป็นโทนเข้มให้เข้ากับธีมไฮเทค -->

  <div class="container py-4">
    <div class="card shadow-sm mx-auto bg-dark border-secondary text-light" style="max-width: 500px;">
      <div class="card-header bg-primary text-white text-center py-3 border-secondary">
        <h4 class="mb-0">📋 บันทึกเวลาทำงาน / OT</h4>
      </div>
      <div class="card-body">
        
        <!-- ฟอร์มบันทึกข้อมูล -->
        <form id="checkInForm">
          
          <!-- ชื่อพนักงาน -->
          <div class="mb-3">
            <label for="nameInput" class="form-label">👤 ชื่อพนักงาน (รหัส):</label>
            <input type="text" class="form-control bg-secondary text-light border-dark" id="nameInput" placeholder="เช่น NMBservice_KKN" required>
          </div>

          <!-- ประเภทรายการ -->
          <div class="mb-3">
            <label for="typeInput" class="form-label">📍 เลือกประเภทการบันทึก:</label>
            <select class="form-select bg-secondary text-light border-dark" id="typeInput" required>
              <option value="เข้างาน">เข้างาน</option>
              <option value="เลิกงาน">เลิกงาน</option>
              <option value="เข้างาน OT SYMC">เข้างาน OT SYMC</option>
              <option value="เลิกงาน OT SYMC">เลิกงาน OT SYMC</option>
              <option value="เข้างาน OT ITEL">เข้างาน OT ITEL</option>
              <option value="เลิกงาน OT ITEL">เลิกงาน OT ITEL</option>
              <option value="เลิกงาน OT อื่น">เลิกงาน OT อื่น (กำหนดค่าแรงเอง)</option>
            </select>
          </div>

          <!-- ช่องกรอกค่า OT อื่นๆ (ซ่อนไว้ก่อน จะแสดงเฉพาะตอนเลือก OT อื่น) -->
          <div class="mb-3" id="customOtContainer" style="display: none;">
            <label for="customOtFee" class="form-label">💰 ระบุค่า OT (บาท):</label>
            <input type="number" class="form-control bg-secondary text-light border-dark" id="customOtFee" placeholder="เช่น 300">
          </div>

          <!-- รายละเอียด / เหตุผล -->
          <div class="mb-3">
            <label for="reasonInput" class="form-label">📝 รายละเอียด / เหตุผล (ถ้ามี):</label>
            <textarea class="form-control bg-secondary text-light border-dark" id="reasonInput" rows="2" placeholder="ระบุเหตุผล เช่น มาสายเพราะรถติด หรือรายละเอียดงาน"></textarea>
          </div>

          <!-- ปุ่มกดส่งข้อมูล -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success btn-lg" id="submitBtn">
              ✅ บันทึกข้อมูล
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // ⚠️ [สำคัญ] นำ Web App URL ที่ได้จากการ Deploy Google Apps Script มาใส่ตรงนี้
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZp93MR15Yc-haCY1BBVOmAW3KyYlN3mZq7_Bhu7qfiJtENrgJWF7dX9HUKyYOubSmGA/exec";
    
    // ⚠️ [สำคัญ] ใส่ LIFF ID ของคุณที่นี่
    const LIFF_ID = "2010782987-4mjGpChs"; 

    let userLineId = "-";

    // 1. เริ่มต้นการทำงานของ LIFF เมื่อเปิดหน้าเว็บ
    window.onload = function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            // ดึง User ID ของผู้ใช้ปัจจุบัน
            const context = liff.getContext();
            if (context && context.userId) {
              userLineId = context.userId;
            }
            
            // ดึงชื่อ Display Name ของ LINE มาเติมให้อัตโนมัติ (ถ้ายังไม่ได้กรอก)
            liff.getProfile().then(profile => {
              const nameInput = document.getElementById('nameInput');
              if (nameInput && !nameInput.value) {
                nameInput.value = profile.displayName;
              }
            }).catch(err => console.error(err));
          }
        })
        .catch(err => {
          console.error("LIFF Initialization failed", err);
        });
    };

    // 2. จัดการการแสดงผลช่องกรอกค่า OT อื่นๆ ตามประเภทที่เลือก
    document.getElementById('typeInput').addEventListener('change', function() {
      const selectedType = this.value;
      const customContainer = document.getElementById('customOtContainer');
      if (selectedType === 'เลิกงาน OT อื่น') {
        customContainer.style.display = 'block';
      } else {
        customContainer.style.display = 'none';
      }
    });

    // 3. เมื่อกดปุ่มส่งฟอร์ม
    document.getElementById('checkInForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังบันทึกข้อมูล...";

      // ดึงเวลาปัจจุบันสำหรับแสดงในแชท
      const currentTime = new Date().toLocaleTimeString('th-TH', { hour12: false });

      // รวบรวมข้อมูลจากฟอร์ม
      const payload = {
        action: "checkIn",
        userId: userLineId,
        name: document.getElementById('nameInput').value.trim(),
        type: document.getElementById('typeInput').value,
        customOtFee: document.getElementById('customOtFee').value || 0,
        otDetails: document.getElementById('reasonInput').value.trim(),
        reason: document.getElementById('reasonInput').value.trim(),
        lat: "-", 
        lng: "-"
      };

      // ยิงข้อมูลไปที่ Google Apps Script
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ บันทึกข้อมูล";

        if (data.success) {
          
          // 🟢 เมื่อบันทึกสำเร็จ ให้ส่งข้อความเข้าแชทฝั่งผู้ใช้ (ฝั่งขวามือ สีเขียว)
          if (liff.isInClient()) {
            
            // สร้างรูปแบบข้อความให้เหมือนในรูปตัวอย่าง
            let msgText = "✅ บันทึก" + payload.type + "เรียบร้อยแล้ว\n";
            msgText += "เวลา: " + currentTime + "\n";
            msgText += "สถานะ: " + (data.workStatus || 'ปกติ') + "\n";
            msgText += "พนักงาน: " + payload.name;
            
            // ถ้ามีเหตุผลให้แสดงด้วย
            if (payload.reason && payload.reason !== "") {
              msgText += "\n💬 เหตุผล: " + payload.reason;
            }

            // ส่งข้อความในฐานะผู้ใช้
            liff.sendMessages([
              {
                type: 'text',
                text: msgText
              }
            ]).then(() => {
              // ปิดหน้าต่าง LIFF กลับไปที่แชท
              liff.closeWindow();
            }).catch((err) => {
              console.error('LIFF sendMessages failed', err);
              // แจ้งเตือนธรรมดาถ้าส่งข้อความไม่ผ่าน แล้วค่อยปิดหน้าต่าง
              alert("✅ บันทึกข้อมูลสำเร็จ (แต่ส่งข้อความเข้าแชทไม่ได้)");
              liff.closeWindow();
            });

          } else {
             // กรณีไม่ได้เปิดผ่านแอป LINE (เช่น เปิดเบราว์เซอร์ในคอม)
             alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว");
             window.close();
          }

        } else {
          alert("❌ เกิดข้อผิดพลาด: " + data.message);
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ บันทึกข้อมูล";
        alert("❌ เชื่อมต่อระบบล้มเหลว: " + error);
      });
    });
  </script>

</body>
</html>
