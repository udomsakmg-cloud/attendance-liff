<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลางานและจัดการ OT</title>
  <!-- Bootstrap 5 CSS สำหรับความสวยงามและการจัดวาง -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0">📋 บันทึกเวลาทำงาน / OT / ลางาน</h4>
      </div>
      <div class="card-body">
        
        <!-- ฟอร์มบันทึกข้อมูล -->
        <form id="checkInForm">
          
          <!-- ชื่อพนักงาน -->
          <div class="mb-3">
            <label for="nameInput" class="form-label">👤 ชื่อ-นามสกุลพนักงาน:</label>
            <input type="text" class="form-control" id="nameInput" placeholder="กรอกชื่อของคุณ" required>
          </div>

          <!-- ประเภทรายการ -->
          <div class="mb-3">
            <label for="typeInput" class="form-label">📍 เลือกประเภทการบันทึก:</label>
            <select class="form-select" id="typeInput" required>
              <option value="เข้างาน">เข้างานปกติ</option>
              <option value="เลิกงาน">เลิกงานปกติ</option>
              <option value="เข้างาน OT SYMC">เข้างาน OT SYMC</option>
              <option value="เลิกงาน OT SYMC">เลิกงาน OT SYMC</option>
              <option value="เข้างาน OT ITEL">เข้างาน OT ITEL</option>
              <option value="เลิกงาน OT ITEL">เลิกงาน OT ITEL</option>
              <option value="เลิกงาน OT อื่น">เลิกงาน OT อื่น (กำหนดค่าแรงเอง)</option>
            </select>
          </div>

          <!-- ช่องกรอกค่า OT อื่นๆ (ซ่อนไว้ก่อน จะแสดงเฉพาะตอนเลือก OT อื่น) -->
          <div class="mb-3" id="customOtContainer" style="display: none;">
            <label for="customOtFee" class="form-label">💰 ระบุค่า OT (บาท):</label>
            <input type="number" class="form-control" id="customOtFee" placeholder="เช่น 300">
          </div>

          <!-- รายละเอียด / เหตุผล -->
          <div class="mb-3">
            <label for="reasonInput" class="form-label">📝 รายละเอียด / เหตุผล (ถ้ามี):</label>
            <textarea class="form-control" id="reasonInput" rows="2" placeholder="ระบุเหตุผล หรือรายละเอียดงาน"></textarea>
          </div>

          <!-- ปุ่มกดส่งข้อมูล -->
          <div class="d-grid">
            <button type="submit" class="accumulator-btn btn btn-success btn-lg" id="submitBtn">
              ✅ บันทึกข้อมูล
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- JavaScript สำหรับควบคุม LIFF และเชื่อมต่อ Google Apps Script -->
  <script>
    // ⚠️ [สำคัญ] นำ Web App URL ที่ได้จากการ Deploy Google Apps Script มาใส่ตรงนี้
    const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
    
    // ⚠️ [สำคัญ] ใส่ LIFF ID ของคุณที่นี่
    const LIFF_ID = "YOUR_LIFF_ID_HERE"; 

    let userLineId = "-";

    // 1. เริ่มต้นการทำงานของ LIFF เมื่อเปิดหน้าเว็บ
    window.onload = function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            // ดึง User ID ของผู้ใช้ปัจจุบัน
            const context = liff.getContext();
            if (context && context.userId) {
              userLineId = context.userId;
            }
            
            // (ทางเลือก) ดึงชื่อ Display Name ของ LINE มาเติมให้อัตโนมัติ
            liff.getProfile().then(profile => {
              const nameInput = document.getElementById('nameInput');
              if (nameInput && !nameInput.value) {
                nameInput.value = profile.displayName;
              }
            }).catch(err => console.error(err));
          }
        })
        .catch(err => {
          console.error("LIFF Initialization failed", err);
        });
    };

    // 2. จัดการการแสดงผลช่องกรอกค่า OT อื่นๆ ตามประเภทที่เลือก
    document.getElementById('typeInput').addEventListener('change', function() {
      const selectedType = this.value;
      const customContainer = document.getElementById('customOtContainer');
      if (selectedType === 'เลิกงาน OT อื่น') {
        customContainer.style.display = 'block';
      } else {
        customContainer.style.display = 'none';
      }
    });

    // 3. เมื่อกดปุ่มส่งฟอร์ม
    document.getElementById('checkInForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังบันทึก...";

      // รวบรวมข้อมูลจากฟอร์ม
      const payload = {
        action: "checkIn", // แยกประเภทการทำงานฝั่ง Apps Script
        userId: userLineId,
        name: document.getElementById('nameInput').value.trim(),
        type: document.getElementById('typeInput').value,
        customOtFee: document.getElementById('customOtFee').value || 0,
        otDetails: document.getElementById('reasonInput').value.trim(),
        reason: document.getElementById('reasonInput').value.trim(),
        lat: "-", // หากต้องการดึงพิกัด GPS จริง สามารถใส่ Geolocation API เพิ่มได้ที่นี่
        lng: "-"
      };

      // ยิงข้อมูลไปที่ Google Apps Script
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ บันทึกข้อมูล";

        if (data.success) {
          // 🟢 แจ้งเตือนพนักงานทันทีเมื่อบันทึกสำเร็จ
          alert("✅ " + data.message + (data.otFee && data.otFee !== "-" ? "\n💰 ค่า OT: " + data.otFee : ""));
          
          // ล้างฟอร์มหรือปิดหน้าต่าง LIFF ตามต้องการ
          // liff.closeWindow();
        } else {
          alert("❌ เกิดข้อผิดพลาด: " + data.message);
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ บันทึกข้อมูล";
        alert("❌ เชื่อมต่อระบบล้มเหลว: " + error);
      });
    });
  </script>

</body>
</html>
