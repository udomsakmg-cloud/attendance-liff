<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px 15px; }
    button {
      width: 100%; padding: 16px; margin: 8px 0; font-size: 17px;
      border: none; border-radius: 10px; color: white;
    }
    #checkin { background: #06C755; }
    #checkout { background: #FF5555; }
    #openExternal { background: #888; font-size: 14px; padding: 12px; }
    #photoInput {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      z-index: -1;
    }
    #status { margin-top: 15px; font-size: 14px; white-space: pre-line; }
    #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h2>📍 ลงเวลางาน</h2>
  <input type="file" id="photoInput" accept="image/*" capture="user">
  <img id="preview">
  <button id="checkin">✅ เข้างาน</button>
  <button id="checkout">🔴 เลิกงาน</button>
  <button id="openExternal">🌐 เปิดด้วยเบราว์เซอร์ภายนอก (ถ้า GPS ไม่ทำงาน)</button>
  <div id="status">กำลังเตรียมระบบ...</div>

  <script>
    document.getElementById('status').innerText = '0) สคริปต์เริ่มทำงานแล้ว...';

    const LIFF_ID = '2010782987-4mjGpChs';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwE9qtRGCaj0XnN9pl8rAoE-p6W4-nbkC40uy3zwho2m9zgGMg9x0ZzJSNlD3lfrYFkFg/exec';

    let pendingType = null;
    let liffReady = false;

    document.getElementById('status').innerText = '0.5) เช็ค LIFF SDK... typeof liff = ' + typeof liff;

    if (typeof liff === 'undefined') {
      document.getElementById('status').innerText = '❌ โหลด LIFF SDK ไม่สำเร็จ กรุณาเช็คอินเทอร์เน็ต แล้วลองเปิดใหม่';
    } else {
      document.getElementById('status').innerText = '0.7) กำลังเรียก liff.init()...';

      let initFinished = false;
      setTimeout(() => {
        if (!initFinished) {
          document.getElementById('status').innerText =
            '❌ liff.init() ค้างเกิน 10 วิ ไม่ resolve/reject เลย\n(อาจเป็นปัญหาเน็ตเวิร์คหรือ LIFF ID ผิด)';
        }
      }, 10000);

      liff.init({ liffId: LIFF_ID }).then(() => {
        initFinished = true;
        liffReady = true;
        document.getElementById('status').innerText = 'พร้อมใช้งาน กดปุ่มเพื่อลงเวลา';
      }).catch(err => {
        initFinished = true;
        document.getElementById('status').innerText = '❌ liff.init error: ' + JSON.stringify(err);
      });
    }

    document.getElementById('checkin').onclick = () => startCheckIn('เข้างาน');
    document.getElementById('checkout').onclick = () => startCheckIn('เลิกงาน');

    document.getElementById('openExternal').onclick = () => {
      if (liffReady && liff.isInClient()) {
        liff.openWindow({ url: window.location.href, external: true });
      } else {
        document.getElementById('status').innerText = 'หน้านี้เปิดอยู่นอก LINE แล้ว หรือยังไม่พร้อม กรุณากดปุ่มเข้างาน/เลิกงานได้เลย';
      }
    };

    function startCheckIn(type) {
      pendingType = type;
      document.getElementById('photoInput').click();
    }

    document.getElementById('photoInput').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        const imageBase64 = reader.result;
        document.getElementById('preview').src = imageBase64;
        document.getElementById('preview').style.display = 'block';
        getLocationAndSubmit(imageBase64);
      };
      reader.readAsDataURL(file);
    };

    function getLocationAndSubmit(imageBase64) {
      document.getElementById('status').innerText = '1) เรียก GPS...';

      if (!navigator.geolocation) {
        document.getElementById('status').innerText = '❌ เบราว์เซอร์นี้ไม่รองรับ GPS';
        return;
      }

      let finished = false;
      const fallbackTimer = setTimeout(() => {
        if (!finished) {
          finished = true;
          document.getElementById('status').innerText =
            '❌ ไม่สามารถดึง GPS ผ่าน LINE ได้\n\nกรุณากดปุ่ม "🌐 เปิดด้วยเบราว์เซอร์ภายนอก" ด้านบน แล้วลองใหม่';
        }
      }, 8000);

      navigator.geolocation.getCurrentPosition(async (pos) => {
        if (finished) return;
        finished = true;
        clearTimeout(fallbackTimer);
        await submitData(pos.coords.latitude, pos.coords.longitude, imageBase64);
      }, (err) => {
        if (finished) return;
        finished = true;
        clearTimeout(fallbackTimer);
        document.getElementById('status').innerText =
          `❌ GPS error (code: ${err.code}): ${err.message}\n\nกรุณากดปุ่ม "🌐 เปิดด้วยเบราว์เซอร์ภายนอก" ด้านบน แล้วลองใหม่`;
      }, { enableHighAccuracy: false, timeout: 7000, maximumAge: 0 });
    }

    async function submitData(lat, lng, imageBase64) {
      document.getElementById('status').innerText = '2) ได้ตำแหน่งแล้ว กำลังดึงโปรไฟล์...';

      let name = null;

      try {
        if (liffReady && liff.isLoggedIn && liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          name = profile.displayName;
        }
      } catch (err) {
        name = null;
      }

      if (!name) {
        name = prompt('ไม่สามารถดึงชื่อจาก LINE ได้ กรุณาพิมพ์ชื่อ-นามสกุลของคุณ:');
        if (!name) {
          document.getElementById('status').innerText = '❌ ยกเลิก: ไม่ได้กรอกชื่อ';
          return;
        }
      }

      document.getElementById('status').innerText = '3) กำลังส่งข้อมูล...';

      try {
        const payload = {
          name: name,
          type: pendingType,
          lat: lat,
          lng: lng,
          image: imageBase64
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        document.getElementById('status').innerText =
          result.success ? '✅ ' + result.message : '❌ ' + result.message;

      } catch (err) {
        document.getElementById('status').innerText = '❌ ส่งข้อมูลไม่สำเร็จ: ' + err.message;
      }
    }
  </script>
</body>
</html>
