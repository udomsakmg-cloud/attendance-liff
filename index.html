<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกเวลาทำงาน & ยื่นลางาน</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Prompt', sans-serif, system-ui; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    
    <!-- Header: โปรไฟล์ผู้ใช้ -->
    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 p-6 text-white text-center relative">
      <div class="flex justify-center mb-3">
        <img id="userAvatar" src="https://via.placeholder.com/100" class="w-20 h-20 rounded-full border-4 border-white/30 object-cover shadow-md">
      </div>
      <h2 id="userName" class="text-xl font-bold">กำลังโหลดข้อมูล...</h2>
      <p id="userId" class="text-xs text-emerald-100 opacity-80 mt-1">LINE ID: -</p>
    </div>

    <!-- Form Body -->
    <div class="p-6 space-y-4">
      
      <!-- เลือกประเภทการลงเวลา -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1"><i class="fa-solid fa-list-check text-emerald-600 mr-2"></i>ประเภทรายการ</label>
        <select id="checkType" onchange="toggleFormFields()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
          <optgroup label="⏱️ เวลาปกติ">
            <option value="เข้างาน">เข้างานปกติ</option>
            <option value="เลิกงาน">เลิกงานปกติ</option>
          </optgroup>
          <optgroup label="💼 OT SYMC">
            <option value="เข้างาน OT SYMC">เข้างาน OT SYMC</option>
            <option value="เลิกงาน OT SYMC">เลิกงาน OT SYMC</option>
          </optgroup>
          <optgroup label="💼 OT ITEL">
            <option value="เข้างาน OT ITEL">เข้างาน OT ITEL</option>
            <option value="เลิกงาน OT ITEL">เลิกงาน OT ITEL</option>
          </optgroup>
          <optgroup label="💼 OT อื่นๆ">
            <option value="เลิกงาน OT อื่น">เลิกงาน OT อื่นๆ</option>
          </optgroup>
          <optgroup label="📝 ยื่นลางาน">
            <option value="ยื่นลางาน">ยื่นขอลางาน</option>
          </optgroup>
        </select>
      </div>

      <!-- ส่วน: แบบฟอร์มลงเวลาปกติ / OT -->
      <div id="checkInSection" class="space-y-4">
        
        <!-- พิกัด GPS -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2 text-sm text-slate-600">
            <i class="fa-solid fa-location-dot text-rose-500 text-lg"></i>
            <span id="gpsStatus" class="font-medium">กำลังค้นหาพิกัด...</span>
          </div>
          <button type="button" onclick="getLocation()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded-lg transition-all">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>

        <!-- เหตุผลการมาสาย -->
        <div id="lateReasonBox" class="hidden">
          <label class="block text-sm font-semibold text-slate-700 mb-1 text-amber-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>เหตุผลที่มาสาย</label>
          <input type="text" id="lateReason" placeholder="ระบุเหตุผลการมาสาย..." class="w-full p-3 bg-amber-50 border border-amber-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <!-- ระบุค่า OT เพิ่มเติม (กรณี OT อื่นๆ) -->
        <div id="customOtBox" class="hidden">
          <label class="block text-sm font-semibold text-slate-700 mb-1"><i class="fa-solid fa-coins text-amber-500 mr-2"></i>จำนวนเงินค่า OT (บาท)</label>
          <input type="number" id="customOtFee" placeholder="เช่น 200" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <!-- รายละเอียด OT -->
        <div id="otDetailsBox" class="hidden">
          <label class="block text-sm font-semibold text-slate-700 mb-1"><i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i>รายละเอียดงาน OT</label>
          <textarea id="otDetails" rows="2" placeholder="ระบุรายละเอียดงานที่ทำ..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
        </div>

        <!-- ถ่ายรูป -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1"><i class="fa-solid fa-camera text-emerald-600 mr-2"></i>ถ่ายรูปแนบ (กล้อง)</label>
          <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewAndCompressImage(event)" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-xl">
          
          <!-- พรีวิวรูปภาพ -->
          <div id="previewBox" class="hidden mt-3 relative">
            <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-xl border border-slate-200">
            <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded-md">บีบอัดรูปเรียบร้อย</span>
          </div>
        </div>

      </div>

      <!-- ส่วน: แบบฟอร์มยื่นลางาน -->
      <div id="leaveSection" class="hidden space-y-3 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ประเภทการลา</label>
          <select id="leaveType" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl">
            <option value="ลากิจ">ลากิจ</option>
            <option value="ลาป่วย">ลาป่วย</option>
            <option value="พักร้อน">พักร้อน</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">เริ่มวันที่</label>
            <input type="date" id="leaveStartDate" class="w-full p-2 bg-white border border-slate-200 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ถึงวันที่</label>
            <input type="date" id="leaveEndDate" class="w-full p-2 bg-white border border-slate-200 rounded-xl text-sm">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">เหตุผลการลา</label>
          <input type="text" id="leaveReason" placeholder="ระบุเหตุผล..." class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-sm">
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="button" id="btnSubmit" onclick="handleSubmit()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>บันทึกข้อมูล</span>
      </button>

    </div>
  </div>

  <script>
    // ==========================================
    // 1. ตั้งค่า CONFIG (ใส่ URL ของคุณที่นี่)
    // ==========================================
    const CONFIG = {
      GAS_WEB_APP_URL: 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE', 
      LIFF_ID: 'YOUR_LIFF_ID_HERE' 
    };

    // ตัวแปร Global
    let currentUserProfile = { displayName: 'ไม่ระบุชื่อ', userId: '-' };
    let currentGeo = { lat: '-', lng: '-' };
    let compressedBase64Image = '';

    // ==========================================
    // 2. เริ่มต้นระบบ (LIFF Init)
    // ==========================================
    window.onload = async function() {
      getLocation();
      try {
        if (CONFIG.LIFF_ID && CONFIG.LIFF_ID !== 'YOUR_LIFF_ID_HERE') {
          await liff.init({ liffId: CONFIG.LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUserProfile = profile;
            document.getElementById('userName').innerText = profile.displayName;
            document.getElementById('userId').innerText = 'LINE ID: ' + profile.userId;
            if (profile.pictureUrl) {
              document.getElementById('userAvatar').src = profile.pictureUrl;
            }
          } else {
            liff.login();
          }
        } else {
          document.getElementById('userName').innerText = 'โหมดทดสอบ (ไม่ได้ต่อ LIFF)';
        }
      } catch (err) {
        console.error('LIFF Error:', err);
        document.getElementById('userName').innerText = 'พนักงานทั่วไป';
      }
    };

    // ==========================================
    // 3. ฟังก์ชันดึงพิกัด GPS
    // ==========================================
    function getLocation() {
      const statusEl = document.getElementById('gpsStatus');
      statusEl.innerText = 'กำลังค้นหาพิกัด...';
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentGeo.lat = pos.coords.latitude;
            currentGeo.lng = pos.coords.longitude;
            statusEl.innerText = `พิกัด: ${currentGeo.lat.toFixed(4)}, ${currentGeo.lng.toFixed(4)}`;
            statusEl.classList.add('text-emerald-600');
          },
          (err) => {
            statusEl.innerText = 'ไม่สามารถดึงพิกัด GPS ได้';
            statusEl.classList.add('text-rose-500');
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        statusEl.innerText = 'อุปกรณ์ไม่รองรับ GPS';
      }
    }

    // ==========================================
    // 4. บีบอัดรูปภาพฝั่ง Client
    // ==========================================
    function previewAndCompressImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          const maxWidth = 800;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          compressedBase64Image = canvas.toDataURL('image/jpeg', 0.6);

          document.getElementById('imagePreview').src = compressedBase64Image;
          document.getElementById('previewBox').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 5. สลับฟิลด์ในแบบฟอร์มตามประเภทการเลือก
    // ==========================================
    function toggleFormFields() {
      const type = document.getElementById('checkType').value;
      const isLeave = (type === 'ยื่นลางาน');
      const isOT = type.includes('OT');

      document.getElementById('checkInSection').classList.toggle('hidden', isLeave);
      document.getElementById('leaveSection').classList.toggle('hidden', !isLeave);

      document.getElementById('otDetailsBox').classList.toggle('hidden', !isOT);
      document.getElementById('customOtBox').classList.toggle('hidden', type !== 'เลิกงาน OT อื่น');

      if (type === 'เข้างาน') {
        const now = new Date();
        const currentTimeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('lateReasonBox').classList.toggle('hidden', currentTimeStr <= '08:30');
      } else {
        document.getElementById('lateReasonBox').classList.add('hidden');
      }
    }

    // ==========================================
    // 6. Optimistic UI: แสดง "บันทึกสำเร็จแล้ว" ทันทีในทุกเมนู
    // ==========================================
    async function handleSubmit() {
      const btn = document.getElementById('btnSubmit');
      const checkType = document.getElementById('checkType').value;

      // ตรวจสอบความถูกต้องเบื้องต้นก่อนส่ง (Client-side validation)
      if (checkType === 'ยื่นลางาน') {
        const startDate = document.getElementById('leaveStartDate').value;
        const endDate = document.getElementById('leaveEndDate').value;
        if (!startDate || !endDate) {
          Swal.fire({ icon: 'warning', title: 'กรุณาระบุช่วงวันที่ลางาน', confirmButtonColor: '#059669' });
          return;
        }
      }

      // -----------------------------------------------------------
      // [Optimistic UI]: แสดงผล "บันทึกสำเร็จแล้ว" ทันที ไม่ต้องรอเซิร์ฟเวอร์
      // -----------------------------------------------------------
      const originalBtnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>กำลังบันทึก...</span>`;

      Swal.fire({
        icon: 'success',
        title: 'บันทึกสำเร็จแล้ว',
        text: 'ระบบกำลังประมวลผลข้อมูลในระบบ...',
        timer: 1500,
        showConfirmButton: false
      });

      // เตรียมข้อมูล Payload สำหรับส่งไป Apps Script
      let payload = {
        name: currentUserProfile.displayName,
        userId: currentUserProfile.userId,
        type: checkType
      };

      if (checkType === 'ยื่นลางาน') {
        payload.action = 'requestLeave';
        payload.leaveType = document.getElementById('leaveType').value;
        payload.startDate = document.getElementById('leaveStartDate').value;
        payload.endDate = document.getElementById('leaveEndDate').value;
        payload.reason = document.getElementById('leaveReason').value;
      } else {
        payload.lat = currentGeo.lat;
        payload.lng = currentGeo.lng;
        payload.image = compressedBase64Image;
        payload.reason = document.getElementById('lateReason').value || '-';
        payload.otDetails = document.getElementById('otDetails').value || '-';
        payload.customOtFee = document.getElementById('customOtFee').value || '';
      }

      // -----------------------------------------------------------
      // ส่งข้อมูลไปยัง Apps Script ใน Background
      // -----------------------------------------------------------
      try {
        const response = await fetch(CONFIG.GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          // หากสำเร็จ ปิดหน้าต่าง LIFF ทันที
          setTimeout(() => {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
              liff.closeWindow();
            }
          }, 500);
        } else {
          // หากหลังบ้านตีกลับว่าไม่ผ่าน (เช่น กดซ้ำใน 30 นาที หรือระยะทางเกิน) ให้โยน Error ไปทำ Rollback
          throw new Error(result.message);
        }

      } catch (err) {
        // -----------------------------------------------------------
        // [Rollback]: หากเกิดข้อผิดพลาด ให้คืนค่าปุ่มกดและแสดงการแจ้งเตือน
        // -----------------------------------------------------------
        Swal.fire({
          icon: 'warning',
          title: 'ไม่สามารถบันทึกได้',
          text: err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์',
          confirmButtonText: 'ตกลง',
          confirmButtonColor: '#059669'
        });

        btn.disabled = false;
        btn.innerHTML = originalBtnHtml;
      }
    }
  </script>
</body>
</html>
