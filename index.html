<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px 15px; background-color: #f4f6f9; }
    h2 { margin-top: 0; color: #333; }
    
    /* กรอบวิดีโอกล้อง */
    #camera-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 15px auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #videoStream {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }
    
    button {
      width: 100%; padding: 15px; margin: 6px 0; font-size: 16px; font-weight: bold;
      border: none; border-radius: 10px; color: white; cursor: pointer;
    }
    #checkin { background: #06C755; }          /* เขียว */
    #checkout { background: #FF5555; }         /* แดง */
    #checkinOT_SYMC { background: #2b90d9; }    /* ฟ้า */
    #checkoutOT_SYMC { background: #f39c12; }   /* ส้ม */
    #checkinOT_ITEL { background: #8e44ad; }    /* ม่วง */
    #checkoutOT_ITEL { background: #d35400; }   /* น้ำตาลส้ม */
    #checkinOT_OTHER { background: #6c757d; }   /* เทา */
    #checkoutOT_OTHER { background: #343a40; }  /* เทาเข้ม (OT อื่น) */
    #openExternal { background: #888; font-size: 14px; padding: 12px; }
    
    /* กล่องกรอกข้อมูล */
    #reason-container, #ot-details-container, #other-ot-container {
      display: none;
      max-width: 400px;
      margin: 15px auto;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: left;
    }
    #reason-container label { font-weight: bold; color: #d9534f; display: block; margin-bottom: 8px; }
    #ot-details-container label { font-weight: bold; color: #2b90d9; display: block; margin-bottom: 8px; }
    #other-ot-container label { font-weight: bold; color: #343a40; display: block; margin-bottom: 8px; }

    input[type="number"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
      margin-bottom: 10px;
    }
    textarea { height: 80px; resize: none; margin-bottom: 0; }

    #submitReasonBtn { background: #f0ad4e; color: white; margin-top: 10px; }
    #submitOtDetailsBtn { background: #2b90d9; color: white; margin-top: 10px; }
    #submitOtherOtBtn { background: #343a40; color: white; margin-top: 10px; }

    #status { margin-top: 15px; font-size: 14px; white-space: pre-line; color: #333; font-weight: bold; }
    #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h2>📍 ลงเวลางาน</h2>

  <!-- พื้นที่แสดงกล้องสด -->
  <div id="camera-container">
    <video id="videoStream" autoplay playsinline></video>
  </div>
  
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="preview" alt="รูปที่ถ่าย">
  
  <!-- กล่องกรอกเหตุผลกรณีมาสาย -->
  <div id="reason-container">
    <label>🔴 ตรวจพบว่าคุณมาสาย (หลัง 08:30 น.)</label>
    <p style="font-size: 13px; color: #666; margin-top: 0;">กรุณาระบุเหตุผลความจำเป็นที่มาสาย:</p>
    <textarea id="lateReason" placeholder="เช่น รถติด, ฝนตกหนัก, ติดภารกิจด่วน..."></textarea>
    <button id="submitReasonBtn">📤 ยืนยันการส่งข้อมูลพร้อมเหตุผล</button>
  </div>

  <!-- กล่องกรอกรายละเอียดงาน OT SYMC / ITEL -->
  <div id="ot-details-container">
    <label>📝 กรอกรายละเอียดงาน OT</label>
    <p style="font-size: 13px; color: #666; margin-top: 0;">กรุณาระบุรายละเอียดงานที่ทำในการปฏิบัติงาน OT ครั้งนี้:</p>
    <textarea id="otDetails" placeholder="เช่น ซ่อมบำรุงสายไฟเบอร์ออฟติก, ติดตั้งอุปกรณ์..."></textarea>
    <button id="submitOtDetailsBtn">📤 ยืนยันการบันทึกเลิกงาน OT</button>
  </div>

  <!-- กล่องกรอกข้อมูล OT อื่น (ใส่เงินเอง + เหตุผล) -->
  <div id="other-ot-container">
    <label>⚙️ กรอกข้อมูล OT อื่น</label>
    <p style="font-size: 13px; color: #666; margin-top: 0;">กรุณากำหนดจำนวนเงินค่า OT และระบุเหตุผล/รายละเอียดงาน:</p>
    <input type="number" id="otCustomFee" placeholder="จำนวนเงิน OT (บาท) เช่น 100, 300..." min="0">
    <textarea id="otOtherDetails" placeholder="เหตุผล / รายละเอียดงาน OT ครั้งนี้..."></textarea>
    <button id="submitOtherOtBtn">📤 ยืนยันการบันทึก OT อื่น</button>
  </div>

  <button id="checkin">✅ เข้างานปกติ (ถ่ายรูป + GPS)</button>
  <button id="checkout">🔴 เลิกงานปกติ (ถ่ายรูป + GPS)</button>
  <button id="checkinOT_SYMC">🔵 เข้างาน OT SYMC (กดบันทึกทันที)</button>
  <button id="checkoutOT_SYMC">🟠 เลิกงาน OT SYMC (กรอกรายละเอียดงาน)</button>
  <button id="checkinOT_ITEL">🟣 เข้างาน OT ITEL (กดบันทึกทันที)</button>
  <button id="checkoutOT_ITEL">🟤 เลิกงาน OT ITEL (กรอกรายละเอียดงาน)</button>
  <button id="checkinOT_OTHER">⚪ เข้างาน OT อื่น (กดบันทึกทันที)</button>
  <button id="checkoutOT_OTHER">⚫ เลิกงาน OT อื่น (ใส่ค่า OT + เหตุผล)</button>
  <button id="openExternal">🌐 เปิดด้วยเบราว์เซอร์ภายนอก</button>
  
  <div id="status">0) กำลังเตรียมระบบ...</div>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('status').innerText = '❌ Error บรรทัด ' + line + ': ' + msg;
    };

    const LIFF_ID = '2010782987-4mjGpChs';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZp93MR15Yc-haCY1BBVOmAW3KyYlN3mZq7_Bhu7qfiJtENrgJWF7dX9HUKyYOubSmGA/exec';
    
    let pendingType = null;
    let liffReady = false;
    let cachedImageBase64 = "";
    const video = document.getElementById('videoStream');
    const canvas = document.getElementById('canvas');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        document.getElementById('status').innerText = '✅ ระบบพร้อมใช้งาน กดปุ่มเพื่อลงเวลาได้เลย';
      } catch (err) {
        document.getElementById('status').innerText = '⚠️ กล้องไม่พร้อมใช้งาน (หากลงเวลา OT ยังคงใช้งานได้ปกติ)';
      }
    }

    if (typeof liff === 'undefined') {
      document.getElementById('status').innerText = '❌ โหลด LIFF SDK ไม่สำเร็จ';
    } else {
      liff.init({ liffId: LIFF_ID }).then(() => {
        liffReady = true;
        startCamera();
      }).catch(err => {
        document.getElementById('status').innerText = '❌ liff.init error: ' + err.message;
      });
    }

    // ผูก Event ปุ่มกด
    document.getElementById('checkin').onclick = () => processAttendance('เข้างาน');
    document.getElementById('checkout').onclick = () => processAttendance('เลิกงาน');
    document.getElementById('checkinOT_SYMC').onclick = () => processAttendance('เข้างาน OT SYMC');
    document.getElementById('checkoutOT_SYMC').onclick = () => processAttendance('เลิกงาน OT SYMC');
    document.getElementById('checkinOT_ITEL').onclick = () => processAttendance('เข้างาน OT ITEL');
    document.getElementById('checkoutOT_ITEL').onclick = () => processAttendance('เลิกงาน OT ITEL');
    document.getElementById('checkinOT_OTHER').onclick = () => processAttendance('เข้างาน OT อื่น');
    document.getElementById('checkoutOT_OTHER').onclick = () => processAttendance('เลิกงาน OT อื่น');

    document.getElementById('openExternal').onclick = () => {
      if (liffReady && liff.isInClient()) {
        liff.openWindow({ url: window.location.href, external: true });
      } else {
        document.getElementById('status').innerText = 'หน้านี้เปิดอยู่นอก LINE แล้ว';
      }
    };

    function processAttendance(type) {
      if (!liffReady) {
        alert("ระบบยังไม่พร้อมใช้งาน กรุณารอสักครู่");
        return;
      }

      pendingType = type;

      // ⚪ เข้างาน OT (SYMC / ITEL / อื่นๆ): ส่งบันทึกทันที
      if (type === 'เข้างาน OT SYMC' || type === 'เข้างาน OT ITEL' || type === 'เข้างาน OT อื่น') {
        cachedImageBase64 = "";
        document.getElementById('camera-container').style.display = 'none';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('reason-container').style.display = 'none';
        document.getElementById('ot-details-container').style.display = 'none';
        document.getElementById('other-ot-container').style.display = 'none';
        
        submitData("-", "-", "", "-", "-", null);
        return;
      }

      // 🟠/🟤 เลิกงาน OT SYMC / ITEL
      if (type === 'เลิกงาน OT SYMC' || type === 'เลิกงาน OT ITEL') {
        cachedImageBase64 = "";
        document.getElementById('camera-container').style.display = 'none';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('reason-container').style.display = 'none';
        document.getElementById('other-ot-container').style.display = 'none';
        document.getElementById('ot-details-container').style.display = 'block';
        document.getElementById('otDetails').value = "";
        hideAllButtons();
        document.getElementById('status').innerText = '📝 กรุณากรอกรายละเอียดงาน OT ด้านบน';
        return;
      }

      // ⚫ เลิกงาน OT อื่น (กรอกเงินเอง + เหตุผล)
      if (type === 'เลิกงาน OT อื่น') {
        cachedImageBase64 = "";
        document.getElementById('camera-container').style.display = 'none';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('reason-container').style.display = 'none';
        document.getElementById('ot-details-container').style.display = 'none';
        document.getElementById('other-ot-container').style.display = 'block';
        document.getElementById('otCustomFee').value = "";
        document.getElementById('otOtherDetails').value = "";
        hideAllButtons();
        document.getElementById('status').innerText = '⚙️ กรุณากรอกจำนวนเงินค่า OT และเหตุผลด้านบน';
        return;
      }

      // 🟢/🔴 งานปกติ: ถ่ายรูป + ดึง GPS
      if (!video.srcObject) {
        alert("ไม่พบสัญญาณกล้อง กรุณาอนุญาตให้ใช้งานกล้อง");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      cachedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
      
      document.getElementById('camera-container').style.display = 'none';
      document.getElementById('preview').src = cachedImageBase64;
      document.getElementById('preview').style.display = 'block';

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hours}:${minutes}`;

      if (type === 'เข้างาน' && currentTime > "08:30") {
        document.getElementById('reason-container').style.display = 'block';
        hideAllButtons();
        document.getElementById('status').innerText = '⚠️ คุณลงเวลาเข้างานหลัง 08:30 น. กรุณากรอกเหตุผลด้านบน';
      } else {
        getLocationAndSubmit(cachedImageBase64, "-", "-");
      }
    }

    // ส่งเหตุผลกรณีมาสาย
    document.getElementById('submitReasonBtn').onclick = () => {
      const reasonText = document.getElementById('lateReason').value.trim();
      if (!reasonText) {
        alert("กรุณากรอกเหตุผลการมาสายก่อนดำเนินการต่อ");
        return;
      }
      document.getElementById('reason-container').style.display = 'none';
      getLocationAndSubmit(cachedImageBase64, reasonText, "-");
    };

    // ส่งรายละเอียดงาน OT SYMC / ITEL
    document.getElementById('submitOtDetailsBtn').onclick = () => {
      const detailsText = document.getElementById('otDetails').value.trim();
      if (!detailsText) {
        alert("กรุณากรอกรายละเอียดงาน OT ก่อนดำเนินการต่อ");
        return;
      }
      document.getElementById('ot-details-container').style.display = 'none';
      submitData("-", "-", "", "-", detailsText, null);
    };

    // ส่งข้อมูล OT อื่น (เงิน + เหตุผล)
    document.getElementById('submitOtherOtBtn').onclick = () => {
      const customFee = document.getElementById('otCustomFee').value.trim();
      const detailsText = document.getElementById('otOtherDetails').value.trim();
      
      if (!customFee || isNaN(customFee) || parseFloat(customFee) <= 0) {
        alert("กรุณากรอกจำนวนเงินค่า OT ให้ถูกต้อง (ต้องมากกว่า 0)");
        return;
      }
      if (!detailsText) {
        alert("กรุณากรอกเหตุผล / รายละเอียดงาน OT");
        return;
      }

      document.getElementById('other-ot-container').style.display = 'none';
      submitData("-", "-", "", "-", detailsText, parseFloat(customFee));
    };

    function hideAllButtons() {
      document.getElementById('checkin').style.display = 'none';
      document.getElementById('checkout').style.display = 'none';
      document.getElementById('checkinOT_SYMC').style.display = 'none';
      document.getElementById('checkoutOT_SYMC').style.display = 'none';
      document.getElementById('checkinOT_ITEL').style.display = 'none';
      document.getElementById('checkoutOT_ITEL').style.display = 'none';
      document.getElementById('checkinOT_OTHER').style.display = 'none';
      document.getElementById('checkoutOT_OTHER').style.display = 'none';
      document.getElementById('openExternal').style.display = 'none';
    }

    function showAllButtons() {
      document.getElementById('checkin').style.display = 'block';
      document.getElementById('checkout').style.display = 'block';
      document.getElementById('checkinOT_SYMC').style.display = 'block';
      document.getElementById('checkoutOT_SYMC').style.display = 'block';
      document.getElementById('checkinOT_ITEL').style.display = 'block';
      document.getElementById('checkoutOT_ITEL').style.display = 'block';
      document.getElementById('checkinOT_OTHER').style.display = 'block';
      document.getElementById('checkoutOT_OTHER').style.display = 'block';
      document.getElementById('openExternal').style.display = 'block';
    }

    function getLocationAndSubmit(imageBase64, reason, otDetails) {
      document.getElementById('status').innerText = '📍 กำลังค้นหาตำแหน่ง GPS...';

      if (!navigator.geolocation) {
        document.getElementById('status').innerText = '❌ เบราว์เซอร์นี้ไม่รองรับ GPS';
        return;
      }

      let gpsFinished = false;
      const gpsTimeout = setTimeout(() => {
        if (!gpsFinished) {
          gpsFinished = true;
          document.getElementById('status').innerText = '❌ ค้นหาพิกัด GPS นานเกินไป กรุณากดปุ่มเปิดภายนอก';
        }
      }, 10000);

      navigator.geolocation.getCurrentPosition(async (pos) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        
        await submitData(pos.coords.latitude, pos.coords.longitude, imageBase64, reason, otDetails, null);
      }, (err) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        document.getElementById('status').innerText = `❌ GPS error: ${err.message}`;
      }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
    }

    async function submitData(lat, lng, imageBase64, reason, otDetails, customOtFee) {
      document.getElementById('status').innerText = '👤 กำลังดึงข้อมูลโปรไฟล์...';

      let name = null;
      try {
        if (liffReady && liff.isLoggedIn && liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          name = profile.displayName;
        }
      } catch (err) { name = null; }

      if (!name) {
        name = prompt('กรุณาพิมพ์ชื่อ-นามสกุลของคุณ:');
        if (!name || name.trim() === "") {
          document.getElementById('status').innerText = '❌ ยกเลิก: ไม่ได้กรอกชื่อ';
          document.getElementById('camera-container').style.display = 'block';
          document.getElementById('preview').style.display = 'none';
          showAllButtons();
          return;
        }
      }

      document.getElementById('status').innerText = '⏳ กำลังส่งข้อมูลเข้าระบบ...';

      try {
        const payload = {
          name: name,
          type: pendingType,
          lat: lat,
          lng: lng,
          image: imageBase64,
          reason: reason,
          otDetails: otDetails || "-",
          customOtFee: customOtFee || null
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          document.getElementById('status').innerText = '✅ ' + result.message;
          
          let lineMsg = `✅ บันทึก${pendingType}เรียบร้อยแล้ว\nเวลา: ${new Date().toLocaleTimeString('th-TH')}\nสถานะ: ${result.workStatus || '-'}\nพนักงาน: ${name}`;
          if (result.otFee && result.otFee !== '-') {
            lineMsg += `\n💰 ค่า OT: ${result.otFee}`;
          }
          if (otDetails && otDetails !== '-') {
            lineMsg += `\n📝 รายละเอียด/เหตุผล: ${otDetails}`;
          }
          if (reason && reason !== '-') {
            lineMsg += `\n💬 เหตุผลมาสาย: ${reason}`;
          }

          if (liffReady && liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: lineMsg }]).then(() => {
              liff.closeWindow();
            }).catch((err) => {
              document.getElementById('status').innerText += '\n(เซฟสำเร็จ แต่ส่งแชทไม่ได้)';
            });
          } else {
             alert(lineMsg);
          }
        } else {
          document.getElementById('status').innerText = '❌ เกิดข้อผิดพลาด: ' + result.message;
          document.getElementById('camera-container').style.display = 'block';
          document.getElementById('preview').style.display = 'none';
          showAllButtons();
        }

      } catch (err) {
        document.getElementById('status').innerText = '❌ ส่งข้อมูลไม่สำเร็จ: ' + err.message;
        document.getElementById('camera-container').style.display = 'block';
        document.getElementById('preview').style.display = 'none';
        showAllButtons();
      }
    }
  </script>
</body>
</html>
