<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px 15px; background-color: #f4f6f9; }
    h2 { margin-top: 0; color: #333; }
    
    /* กรอบวิดีโอกล้อง */
    #camera-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 15px auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #videoStream {
      width: 100%;
      display: block;
      transform: scaleX(-1); /* สลับซ้ายขวาให้เหมือนกระจก */
    }
    
    button {
      width: 100%; padding: 16px; margin: 8px 0; font-size: 17px; font-weight: bold;
      border: none; border-radius: 10px; color: white; cursor: pointer;
    }
    #checkin { background: #06C755; }
    #checkout { background: #FF5555; }
    #openExternal { background: #888; font-size: 14px; padding: 12px; }
    
    /* กล่องกรอกเหตุผลตอนมาสาย */
    #reason-container {
      display: none;
      max-width: 400px;
      margin: 15px auto;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: left;
    }
    #reason-container label {
      font-weight: bold;
      color: #d9534f;
      display: block;
      margin-bottom: 8px;
    }
    #lateReason {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
      resize: none;
    }
    #submitReasonBtn {
      background: #f0ad4e;
      color: white;
      margin-top: 10px;
    }

    #status { margin-top: 15px; font-size: 14px; white-space: pre-line; color: #333; font-weight: bold; }
    #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h2>📍 ลงเวลางาน</h2>

  <!-- พื้นที่แสดงกล้องสด -->
  <div id="camera-container">
    <video id="videoStream" autoplay playsinline></video>
  </div>
  
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="preview" alt="รูปที่ถ่าย">
  
  <!-- กล่องกรอกเหตุผลกรณีมาสาย (ซ่อนไว้ก่อน) -->
  <div id="reason-container">
    <label>🔴 ตรวจพบว่าคุณมาสาย (หลัง 08:30 น.)</label>
    <p style="font-size: 13px; color: #666; margin-top: 0;">กรุณาระบุเหตุผลความจำเป็นที่มาสาย:</p>
    <textarea id="lateReason" placeholder="เช่น รถติด, ฝนตกหนัก, ติดภารกิจด่วน..."></textarea>
    <button id="submitReasonBtn">📤 ยืนยันการส่งข้อมูลพร้อมเหตุผล</button>
  </div>

  <button id="checkin">✅ เข้างาน (ถ่ายรูป)</button>
  <button id="checkout">🔴 เลิกงาน (ถ่ายรูป)</button>
  <button id="openExternal">🌐 เปิดด้วยเบราว์เซอร์ภายนอก (ถ้ากล้อง/GPS ไม่ทำงาน)</button>
  
  <div id="status">0) กำลังเตรียมระบบ...</div>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('status').innerText = '❌ Error บรรทัด ' + line + ': ' + msg;
    };

    const LIFF_ID = '2010782987-4mjGpChs';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZp93MR15Yc-haCY1BBVOmAW3KyYlN3mZq7_Bhu7qfiJtENrgJWF7dX9HUKyYOubSmGA/exec';
    
    let pendingType = null;
    let liffReady = false;
    let cachedImageBase64 = null;
    const video = document.getElementById('videoStream');
    const canvas = document.getElementById('canvas');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        document.getElementById('status').innerText = '✅ กล้องพร้อมใช้งาน กดปุ่มเพื่อลงเวลาได้เลย';
      } catch (err) {
        document.getElementById('status').innerText = '❌ ไม่สามารถเข้าถึงกล้องได้: กรุณาอนุญาตสิทธิ์การเข้าถึงกล้อง';
      }
    }

    document.getElementById('status').innerText = '1) กำลังโหลดระบบ...';

    if (typeof liff === 'undefined') {
      document.getElementById('status').innerText = '❌ โหลด LIFF SDK ไม่สำเร็จ';
    } else {
      liff.init({ liffId: LIFF_ID }).then(() => {
        liffReady = true;
        document.getElementById('status').innerText = '2) กำลังเปิดกล้อง...';
        startCamera();
      }).catch(err => {
        document.getElementById('status').innerText = '❌ liff.init error: ' + err.message;
      });
    }

    document.getElementById('checkin').onclick = () => takePhotoAndProcess('เข้างาน');
    document.getElementById('checkout').onclick = () => takePhotoAndProcess('เลิกงาน');

    document.getElementById('openExternal').onclick = () => {
      if (liffReady && liff.isInClient()) {
        liff.openWindow({ url: window.location.href, external: true });
      } else {
        document.getElementById('status').innerText = 'หน้านี้เปิดอยู่นอก LINE แล้ว';
      }
    };

    function takePhotoAndProcess(type) {
      if (!liffReady) {
        alert("ระบบยังไม่พร้อมใช้งาน กรุณารอสักครู่");
        return;
      }
      if (!video.srcObject) {
        alert("ไม่พบสัญญาณกล้อง กรุณาอนุญาตให้ใช้งานกล้อง");
        return;
      }

      pendingType = type;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      cachedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
      
      document.getElementById('camera-container').style.display = 'none';
      document.getElementById('preview').src = cachedImageBase64;
      document.getElementById('preview').style.display = 'block';

      // ตรวจสอบว่าเป็น "เข้างาน" และเลยเวลา 08:30 น. หรือไม่
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hours}:${minutes}`;

      if (type === 'เข้างาน' && currentTime > "08:30") {
        // หากมาสาย ให้แสดงกล่องกรอกเหตุผล และซ่อนปุ่มกดหลัก
        document.getElementById('reason-container').style.display = 'block';
        document.getElementById('checkin').style.display = 'none';
        document.getElementById('checkout').style.display = 'none';
        document.getElementById('openExternal').style.display = 'none';
        document.getElementById('status').innerText = '⚠️ คุณลงเวลาเข้างานหลัง 08:30 น. กรุณากรอกเหตุผลด้านบน';
      } else {
        // ปกติ หรือ เลิกงาน ให้ส่งข้อมูลทันที
        getLocationAndSubmit(cachedImageBase64, "-");
      }
    }

    // ปุ่มกดส่งเหตุผลกรณีมาสาย
    document.getElementById('submitReasonBtn').onclick = () => {
      const reasonText = document.getElementById('lateReason').value.trim();
      if (!reasonText) {
        alert("กรุณากรอกเหตุผลการมาสายก่อนดำเนินการต่อ");
        return;
      }
      // ซ่อนกล่องกรอกเหตุผล แล้วเริ่มดึง GPS ส่งข้อมูล
      document.getElementById('reason-container').style.display = 'none';
      getLocationAndSubmit(cachedImageBase64, reasonText);
    };

    function getLocationAndSubmit(imageBase64, reason) {
      document.getElementById('status').innerText = '📍 กำลังค้นหาตำแหน่ง GPS...';

      if (!navigator.geolocation) {
        document.getElementById('status').innerText = '❌ เบราว์เซอร์นี้ไม่รองรับ GPS';
        return;
      }

      let gpsFinished = false;
      const gpsTimeout = setTimeout(() => {
        if (!gpsFinished) {
          gpsFinished = true;
          document.getElementById('status').innerText = '❌ ค้นหาพิกัด GPS นานเกินไป กรุณากดปุ่มเปิดภายนอก';
        }
      }, 10000);

      navigator.geolocation.getCurrentPosition(async (pos) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        
        await submitData(pos.coords.latitude, pos.coords.longitude, imageBase64, reason);
      }, (err) => {
        if (gpsFinished) return;
        gpsFinished = true;
        clearTimeout(gpsTimeout);
        document.getElementById('status').innerText = `❌ GPS error: ${err.message}`;
      }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
    }

    async function submitData(lat, lng, imageBase64, reason) {
      document.getElementById('status').innerText = '👤 กำลังดึงข้อมูลโปรไฟล์...';

      let name = null;
      try {
        if (liffReady && liff.isLoggedIn && liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          name = profile.displayName;
        }
      } catch (err) {
        name = null;
      }

      if (!name) {
        name = prompt('กรุณาพิมพ์ชื่อ-นามสกุลของคุณ:');
        if (!name || name.trim() === "") {
          document.getElementById('status').innerText = '❌ ยกเลิก: ไม่ได้กรอกชื่อ';
          document.getElementById('camera-container').style.display = 'block';
          document.getElementById('preview').style.display = 'none';
          document.getElementById('checkin').style.display = 'block';
          document.getElementById('checkout').style.display = 'block';
          document.getElementById('openExternal').style.display = 'block';
          return;
        }
      }

      document.getElementById('status').innerText = '⏳ กำลังส่งข้อมูลเข้าระบบ...';

      try {
        const payload = {
          name: name,
          type: pendingType,
          lat: lat,
          lng: lng,
          image: imageBase64,
          reason: reason
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          document.getElementById('status').innerText = '✅ ' + result.message;
          
          let lineMsg = `✅ บันทึก${pendingType}เรียบร้อยแล้ว\nเวลา: ${new Date().toLocaleTimeString('th-TH')}\nสถานะ: ${result.workStatus || '-'}\nพนักงาน: ${name}`;
          if (reason && reason !== '-') {
            lineMsg += `\n💬 เหตุผล: ${reason}`;
          }

          // ส่งข้อความเข้าแชท LINE พร้อมแนบสถานะและเหตุผล
          if (liffReady && liff.isInClient()) {
            liff.sendMessages([
              {
                type: 'text',
                text: lineMsg
              }
            ]).then(() => {
              liff.closeWindow();
            }).catch((err) => {
              document.getElementById('status').innerText += '\n(เซฟสำเร็จ แต่ส่งแชทไม่ได้)';
            });
          } else {
             alert(lineMsg);
          }
        } else {
          document.getElementById('status').innerText = '❌ เกิดข้อผิดพลาด: ' + result.message;
          document.getElementById('camera-container').style.display = 'block';
          document.getElementById('preview').style.display = 'none';
          document.getElementById('checkin').style.display = 'block';
          document.getElementById('checkout').style.display = 'block';
          document.getElementById('openExternal').style.display = 'block';
        }

      } catch (err) {
        document.getElementById('status').innerText = '❌ ส่งข้อมูลไม่สำเร็จ: ' + err.message;
        document.getElementById('camera-container').style.display = 'block';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('checkin').style.display = 'block';
        document.getElementById('checkout').style.display = 'block';
        document.getElementById('openExternal').style.display = 'block';
      }
    }
  </script>
</body>
</html>
